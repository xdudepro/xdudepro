<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="72" viewBox="0 0 1000 72" role="img" aria-label="Your digital rhythm. For ideas worth keeping close. Small ideas. Serious execution. Make space for what matters.">
  <title>Your digital rhythm. For ideas worth keeping close.</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101010"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".48" stop-color="#E4E4E7"/><stop offset="1" stop-color="#A1A1AA"/></linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".6" fill="#FFFFFF" fill-opacity=".07"/></pattern>
    <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#101012"/><stop offset=".24" stop-color="#77777c"/><stop offset=".34" stop-color="#eeeeef"/><stop offset=".4" stop-color="#55555a"/><stop offset=".48" stop-color="#c5c5c9"/><stop offset=".57" stop-color="#303034"/><stop offset=".76" stop-color="#8b8b91"/><stop offset="1" stop-color="#080808"/></linearGradient>
    <radialGradient id="sheen" cx=".2" cy="0" r=".9"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient></defs>
  <style>
    .mk { transform-box: fill-box; transform-origin: left }
    @keyframes v0 { 0% { opacity:1 } 0.00% { opacity:1 } 0.00% { opacity:1 } 23.00% { opacity:1 } 23.01%,100% { opacity:0 } }
    @keyframes t0 { 0%,0.00% { transform:scaleX(0) } 11.25%,100% { transform:scaleX(1) } }
    @keyframes c0 { 0%,0.00% { transform:translateX(0) } 11.25%,100% { transform:translateX(253px) } }
    .v0 { animation: v0 18s linear infinite } .t0 { animation: t0 18s steps(20) infinite } .c0 { animation: c0 18s steps(20) infinite }
    @keyframes v1 { 0% { opacity:0 } 24.99% { opacity:0 } 25.00% { opacity:1 } 48.00% { opacity:1 } 48.01%,100% { opacity:0 } }
    @keyframes t1 { 0%,25.00% { transform:scaleX(0) } 36.25%,100% { transform:scaleX(1) } }
    @keyframes c1 { 0%,25.00% { transform:translateX(0) } 36.25%,100% { transform:translateX(380px) } }
    .v1 { animation: v1 18s linear infinite } .t1 { animation: t1 18s steps(30) infinite } .c1 { animation: c1 18s steps(30) infinite }
    @keyframes v2 { 0% { opacity:0 } 49.99% { opacity:0 } 50.00% { opacity:1 } 73.00% { opacity:1 } 73.01%,100% { opacity:0 } }
    @keyframes t2 { 0%,50.00% { transform:scaleX(0) } 61.25%,100% { transform:scaleX(1) } }
    @keyframes c2 { 0%,50.00% { transform:translateX(0) } 61.25%,100% { transform:translateX(392px) } }
    .v2 { animation: v2 18s linear infinite } .t2 { animation: t2 18s steps(31) infinite } .c2 { animation: c2 18s steps(31) infinite }
    @keyframes v3 { 0% { opacity:0 } 74.99% { opacity:0 } 75.00% { opacity:1 } 98.00% { opacity:1 } 98.01%,100% { opacity:0 } }
    @keyframes t3 { 0%,75.00% { transform:scaleX(0) } 86.25%,100% { transform:scaleX(1) } }
    @keyframes c3 { 0%,75.00% { transform:translateX(0) } 86.25%,100% { transform:translateX(354px) } }
    .v3 { animation: v3 18s linear infinite } .t3 { animation: t3 18s steps(28) infinite } .c3 { animation: c3 18s steps(28) infinite }
    
    .cur { animation: blink 1s steps(1) infinite } @keyframes blink { 50% { opacity:0 } }
    @media (prefers-reduced-motion: reduce) { .v0,.v1,.v2,.v3,.t0,.t1,.t2,.t3,.c0,.c1,.c2,.c3,.cur { animation:none } }
  </style>
  <rect x="1" y="1" width="998" height="70" rx="35" fill="#050505"/>
  <rect x="1" y="1" width="998" height="70" rx="35" fill="url(#sheen)"/>
  <rect x="1" y="1" width="998" height="70" rx="35" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
  <circle cx="46" cy="36" r="5" fill="url(#chrome)"/>
  <circle cx="46" cy="36" r="10" fill="none" stroke="#FFFFFF" stroke-opacity=".18"/>
  <g class="v0" opacity="1"><mask id="m0"><rect class="t0 mk" x="78" y="14" width="274" height="44" fill="#fff"/></mask>
    <text x="80" y="44" mask="url(#m0)" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="21" font-weight="600" fill="#F4F4F5">Your digital rhythm.</text>
    <g class="c0" transform="translate(253 0)"><rect class="cur" x="82" y="22" width="2" height="28" fill="#F4F4F5"/></g></g>
    <g class="v1" opacity="0"><mask id="m1"><rect class="t1 mk" x="78" y="14" width="408" height="44" fill="#fff"/></mask>
    <text x="80" y="44" mask="url(#m1)" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="21" font-weight="600" fill="#F4F4F5">For ideas worth keeping close.</text>
    <g class="c1"><rect class="cur" x="82" y="22" width="2" height="28" fill="#F4F4F5"/></g></g>
    <g class="v2" opacity="0"><mask id="m2"><rect class="t2 mk" x="78" y="14" width="421" height="44" fill="#fff"/></mask>
    <text x="80" y="44" mask="url(#m2)" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="21" font-weight="600" fill="#F4F4F5">Small ideas. Serious execution.</text>
    <g class="c2"><rect class="cur" x="82" y="22" width="2" height="28" fill="#F4F4F5"/></g></g>
    <g class="v3" opacity="0"><mask id="m3"><rect class="t3 mk" x="78" y="14" width="381" height="44" fill="#fff"/></mask>
    <text x="80" y="44" mask="url(#m3)" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="21" font-weight="600" fill="#F4F4F5">Make space for what matters.</text>
    <g class="c3"><rect class="cur" x="82" y="22" width="2" height="28" fill="#F4F4F5"/></g></g>
    
  <rect x="610" y="20" width="1" height="32" fill="#FFFFFF" fill-opacity=".14"/>
  <text x="640" y="41" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="2.6" fill="#A1A1AA">MOBILE  ·  WEB  ·  IDEA → RELEASE</text>
</svg>
