<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="Technology stack — Mobile: Flutter. Web: React, Next.js. Backend: Firebase, Supabase.">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101010"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".48" stop-color="#E4E4E7"/><stop offset="1" stop-color="#A1A1AA"/></linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".6" fill="#FFFFFF" fill-opacity=".07"/></pattern>
    <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".7"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  </defs>
  <style>.s { animation: s 6s ease-in-out infinite } @keyframes s { 0% { transform: translateX(-260px) } 70%,100% { transform: translateX(1280px) } } @media (prefers-reduced-motion: reduce) { .s { animation:none; opacity:0 } }</style>
  <rect x="1" y="1" width="1278" height="148" rx="16" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity=".08"/>
  <rect x="1" y="1" width="1278" height="148" rx="16" fill="url(#dots)"/>
  <rect class="s" x="0" y="147" width="260" height="2" fill="url(#sw)"/>
  
  <text x="40" y="62" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="500" letter-spacing="2.6" fill="#A1A1AA">MOBILE</text>
  <text x="40" y="104" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="-1" fill="url(#chrome)">Flutter</text>
  <text x="453" y="62" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="500" letter-spacing="2.6" fill="#A1A1AA">WEB</text>
  <text x="453" y="104" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="-1" fill="url(#chrome)">React · Next.js</text>
  <rect x="425" y="40" width="1" height="76" fill="#FFFFFF" fill-opacity=".08"/>
  <text x="866" y="62" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="500" letter-spacing="2.6" fill="#A1A1AA">BACKEND</text>
  <text x="866" y="104" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="600" letter-spacing="-1" fill="url(#chrome)">Firebase · Supabase</text>
  <rect x="838" y="40" width="1" height="76" fill="#FFFFFF" fill-opacity=".08"/>
</svg>
