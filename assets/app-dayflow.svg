<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-label="DayFlow — Make today count.">
  <title>DayFlow — Make today count.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101010"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".48" stop-color="#E4E4E7"/><stop offset="1" stop-color="#A1A1AA"/></linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".6" fill="#FFFFFF" fill-opacity=".07"/></pattern>
    <radialGradient id="gl" cx=".84" cy=".22" r=".55"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .g { transform-box: fill-box; transform-origin: center; animation: float 6s ease-in-out infinite; animation-delay: -1.5s }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    .halo { animation: halo 6s ease-in-out infinite; animation-delay: -1.5s }
    @keyframes halo { 0%,100% { opacity:.35 } 50% { opacity:.9 } }
    @media (prefers-reduced-motion: reduce) { .g,.halo { animation:none } }
  </style>
  <rect x="1" y="1" width="618" height="298" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="618" height="298" rx="16" fill="url(#dots)"/>
  <rect x="1" y="1" width="618" height="298" rx="16" fill="url(#gl)"/>
  <rect x="1" y="1" width="618" height="298" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
  <circle class="halo" cx="516" cy="92" r="58" fill="none" stroke="#FFFFFF" stroke-opacity=".18"/>
  <g class="g"><g transform="translate(516 92)"><g fill="none" stroke="url(#chrome)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-36" y="-36" width="72" height="72" rx="14" stroke-opacity=".4"/><path d="M-20 -12 l6 6 l12 -12"/><path d="M8 -12 h14"/><path d="M-20 12 l6 6 l12 -12"/><path d="M8 12 h14" stroke-opacity=".5"/></g></g></g>
  <text x="40" y="58" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="500" letter-spacing="2.6" fill="#A1A1AA">XDUDE  /  PRODUCTIVITY</text>
  <text x="38" y="112" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="600" letter-spacing="-1.4" fill="#F4F4F5">DayFlow</text>
  <text x="40" y="144" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="500" fill="#E4E4E7">Make today count.</text>
  <text x="40" y="186" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#A1A1AA"><tspan x="40" dy="0">Your tasks, routines, and plans — brought</tspan><tspan x="40" dy="24">together in one calm, focused space.</tspan></text>
  <g font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="1.8">
    <rect x="40" y="246" width="158" height="32" rx="8" fill="#050505" stroke="#FFFFFF" stroke-opacity=".55"/>
    <path d="M56 255 l12 7 l-12 7 z" fill="url(#chrome)"/>
    <text x="78" y="267" fill="#F4F4F5">GOOGLE PLAY  →</text>
  </g>
</svg>
