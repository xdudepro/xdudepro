<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="260" viewBox="0 0 1280 260" role="img" aria-label="Got something worth building? Good products start with a good conversation. xdudelab@gmail.com">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101010"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".48" stop-color="#E4E4E7"/><stop offset="1" stop-color="#A1A1AA"/></linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".6" fill="#FFFFFF" fill-opacity=".07"/></pattern>
    <radialGradient id="gl" cx=".84" cy=".5" r=".5"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".48" stop-color="#E4E4E7"/><stop offset="1" stop-color="#A1A1AA"/></linearGradient>
  </defs>
  <style>
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 3s ease-out infinite }
    @keyframes ring { 0% { transform: scale(.9); opacity:.8 } 100% { transform: scale(1.2); opacity:0 } }
    .arr { animation: nudge 1.6s ease-in-out infinite } @keyframes nudge { 0%,100% { transform: translateX(0) } 50% { transform: translateX(5px) } }
    @media (prefers-reduced-motion: reduce) { .ring,.arr { animation:none } }
  </style>
  <rect x="1" y="1" width="1278" height="258" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="258" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="258" rx="20" fill="url(#gl)"/>
  <rect x="1" y="1" width="1278" height="258" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
  <text x="64" y="74" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#A1A1AA">CONTACT</text>
  <text x="62" y="134" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="50" font-weight="600" letter-spacing="-2" fill="#F4F4F5">Got something worth building?</text>
  <text x="64" y="178" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" fill="#A1A1AA">Good products start with a good conversation.</text>
  <rect class="ring" x="900" y="94" width="316" height="72" rx="36" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="1.5"/>
  <rect x="900" y="94" width="316" height="72" rx="36" fill="url(#btn)"/>
  <text x="940" y="138" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="600" fill="#050505">xdudelab@gmail.com</text>
  <g class="arr"><path d="M1170 130 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#050505" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
