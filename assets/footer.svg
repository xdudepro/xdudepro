    .sh { animation: sh 7s ease-in-out infinite } @keyframes sh { 0% { transform: translateX(-400px) } 60%,100% { transform: translateX(1400px) } }
    @media (prefers-reduced-motion: reduce) { .w1,.w2,.sh { animation:none } .sh { opacity:0 } }
