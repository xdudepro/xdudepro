    <path d="m1195 142 17 20 18 2-23 7-12-9-11 13-9-1 20-32Zm74-14 17 25 15 3-21 5-11-8-10 13-8-2 18-36Z" fill="#E7F5FF" opacity=".85"/>
    <path d="M1005 246q100-19 180 9t296-1v48h-476z" fill="#071522" opacity=".7"/>
    <path d="M1005 278q91-19 170 0t306-5" stroke="#4FD5FF" stroke-width="2" opacity=".3"/>
    <text x="1024" y="105" fill="#FFF" font-family="Arial,sans-serif" font-size="13" font-weight="700">XDude</text>
    <text x="1341" y="104" fill="#EDF7FF" font-family="Arial,sans-serif" font-size="10">Home　 About　 Portfolio</text>
    <text x="1030" y="164" fill="#FFF" font-family="Arial,sans-serif" font-size="25" font-weight="700">Better ideas.</text>
    <text x="1030" y="188" fill="#FFF" font-family="Arial,sans-serif" font-size="18">Bigger tomorrow.</text>
    <text x="1031" y="210" fill="#D9E7F1" font-family="Arial,sans-serif" font-size="10">Modern solutions for a brighter future.</text>
  </g>
  <circle cx="1245" cy="68" r="2" fill="#253746"/>
  <path d="M954 310h577l38 28q4 5-12 7l-566 8-57-14q-10-3-3-10l23-19Z" fill="url(#metal)" stroke="#788691" stroke-width="2"/>
  <path d="M1162 319h153l-13 13h-129z" fill="#303B43" stroke="#82909A" stroke-width="1"/>
