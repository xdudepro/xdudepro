  <text x="78" y="177" fill="url(#chrome)" font-family="Arial,Helvetica,sans-serif" font-size="105" font-weight="800" letter-spacing="-8">XDude</text>
  <path d="M78 192h534" stroke="url(#chrome)" stroke-width="3"/>
  <text x="80" y="239" fill="#F5F8FC" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="600" letter-spacing="9">YOUR DIGITAL RHYTHM</text>
  <text x="82" y="278" fill="#B8D7EA" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="1.5">For ideas worth keeping close</text>
  <rect x="80" y="310" width="450" height="48" rx="24" stroke="#19CFFF" stroke-width="2"/>
  <rect x="80" y="310" width="450" height="48" rx="24" stroke="#19CFFF" stroke-width="5" opacity=".35" filter="url(#glow)"/>
  <text x="111" y="341" fill="#F5FAFF" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="2">LET’S BUILD SOMETHING GREAT</text>
  <path d="M480 333h24m-9-9 9 9-9 9" stroke="#F5FAFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
