<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">XDude — Your digital rhythm</title>
  <desc id="desc">A midnight-navy digital studio banner with the XDude brand, a mountain landscape on a laptop, and mobile devices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="400" gradientUnits="userSpaceOnUse"><stop stop-color="#06111D"/><stop offset=".53" stop-color="#071827"/><stop offset="1" stop-color="#02070D"/></linearGradient>
    <linearGradient id="chrome" x1="75" y1="90" x2="590" y2="184" gradientUnits="userSpaceOnUse"><stop stop-color="#6CE8FF"/><stop offset=".18" stop-color="#FFF"/><stop offset=".48" stop-color="#91A9C0"/><stop offset=".72" stop-color="#FFF"/><stop offset="1" stop-color="#29CFFF"/></linearGradient>
    <linearGradient id="screen" x1="965" y1="76" x2="1492" y2="305" gradientUnits="userSpaceOnUse"><stop stop-color="#102D4C"/><stop offset=".55" stop-color="#193E5D"/><stop offset="1" stop-color="#081522"/></linearGradient>
    <linearGradient id="mountain" x1="1200" y1="145" x2="1278" y2="276" gradientUnits="userSpaceOnUse"><stop stop-color="#E6F4FF"/><stop offset=".13" stop-color="#557F9F"/><stop offset="1" stop-color="#071321"/></linearGradient>
    <linearGradient id="sunset" x1="1180" y1="130" x2="1260" y2="245" gradientUnits="userSpaceOnUse"><stop stop-color="#F8A66A"/><stop offset=".45" stop-color="#B85F69"/><stop offset="1" stop-color="#173956"/></linearGradient>
    <linearGradient id="metal" x1="920" y1="305" x2="1480" y2="355" gradientUnits="userSpaceOnUse"><stop stop-color="#17212B"/><stop offset=".35" stop-color="#C3D0D9"/><stop offset=".55" stop-color="#53616D"/><stop offset=".8" stop-color="#E2E9ED"/><stop offset="1" stop-color="#303943"/></linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="laptopScreen"><rect x="1005" y="77" width="476" height="225" rx="8"/></clipPath>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <ellipse cx="1270" cy="365" rx="480" ry="30" fill="#12BFF4" opacity=".1" filter="url(#glow)"/>
  <path d="M0 338C225 320 394 351 620 337s406-10 980 5v58H0z" fill="#050A10" opacity=".85"/>
  <path d="M0 360h1600" stroke="#1C3140" stroke-width="2" opacity=".5"/>
