    <path d="M884 237q24-29 65-10v67q-35 22-65-1z" fill="#173B59"/>
    <path d="M886 276q30-42 61-28" stroke="#4DCEFF" stroke-width="3" opacity=".7"/>
    <circle cx="895" cy="309" r="8" fill="#19D2A0"/><circle cx="920" cy="309" r="8" fill="#F6F8FC"/><circle cx="945" cy="309" r="8" fill="#F53C38"/>
    <rect x="886" y="333" width="20" height="12" rx="5" fill="#11C985"/><rect x="911" y="333" width="20" height="12" rx="5" fill="#33B5FA"/><rect x="936" y="333" width="20" height="12" rx="5" fill="#ECF3FA"/>
  </g>
  <!-- Tablet at right -->
  <g transform="rotate(4 1530 239)">
    <rect x="1492" y="135" width="102" height="205" rx="15" fill="#05090E" stroke="#8795A1" stroke-width="3"/>
    <rect x="1500" y="148" width="86" height="177" rx="8" fill="#0D2032"/>
    <text x="1508" y="169" fill="#FFF" font-family="Arial,sans-serif" font-size="10" font-weight="700">XDude</text>
    <path d="M1508 221q26-18 65-2v75h-65z" fill="#102D46"/>
    <path d="m1510 280 26-35 14 17 13-21 12 39z" fill="#557B9B"/>
    <text x="1508" y="206" fill="#FFF" font-family="Arial,sans-serif" font-size="16" font-style="italic">Create</text>
    <text x="1508" y="225" fill="#FFF" font-family="Arial,sans-serif" font-size="16" font-style="italic">Build. Grow.</text>
  </g>
