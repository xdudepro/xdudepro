<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">XDude — Your digital rhythm</title>
  <desc id="desc">A dark, polished banner for XDude, a product studio for mobile and web apps focused on planning, productivity, and ideas worth keeping close.</desc>
  <defs>
    <linearGradient id="background" x1="60" y1="20" x2="1510" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B12"/>
      <stop offset=".55" stop-color="#101826"/>
      <stop offset="1" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="metal" x1="210" y1="150" x2="740" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FCFF"/>
      <stop offset=".22" stop-color="#90A6BC"/>
      <stop offset=".43" stop-color="#FFFFFF"/>
      <stop offset=".68" stop-color="#73879B"/>
      <stop offset=".86" stop-color="#F5FBFF"/>
      <stop offset="1" stop-color="#65778B"/>
    </linearGradient>
    <linearGradient id="cyan" x1="230" y1="310" x2="1390" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D4FF"/>
      <stop offset="1" stop-color="#718DFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(520 0 0 300 1190 180)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#167BB0" stop-opacity=".26"/>
      <stop offset="1" stop-color="#167BB0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#A8C6E2" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="160" y="100" width="640" height="300" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="500" rx="28" fill="url(#background)"/>
  <rect width="1600" height="500" rx="28" fill="url(#grid)"/>
  <rect width="1600" height="500" rx="28" fill="url(#glow)"/>
  <rect x="22" y="22" width="1556" height="456" rx="20" stroke="#A9DDF2" stroke-opacity=".15"/>

  <g opacity=".55" fill="none" stroke="url(#cyan)">
    <path d="M1050 105h325a18 18 0 0 1 18 18v41a18 18 0 0 1-18 18h-98" stroke-opacity=".42"/>
    <path d="M1130 385h260a18 18 0 0 0 18-18v-40" stroke-opacity=".38"/>
    <circle cx="1393" cy="123" r="4" fill="#00D4FF" stroke="none"/>
    <circle cx="1408" cy="327" r="4" fill="#718DFF" stroke="none"/>
  </g>

  <g filter="url(#shadow)" opacity=".28">
    <path d="m218 184 84 1 57 53 49-53 93 1-90 74 87 70-94 1-47-51-59 52-94-1 99-72-85-74Z" fill="#00CFFF"/>
  </g>
  <g>
    <path d="m218 176 84 1 57 53 49-53 93 1-90 74 87 70-94 1-47-51-59 52-94-1 99-72-85-74Z" fill="url(#metal)" stroke="#EAF8FF" stroke-opacity=".62" stroke-width="2"/>
    <path d="m501 197 221 1-23 23-220-1 22-23Z" fill="url(#metal)" opacity=".86"/>
    <path d="M493 273h228l-24 23H470l23-23Z" fill="url(#metal)" opacity=".86"/>
    <text x="505" y="269" fill="url(#metal)" font-family="Arial, Helvetica, sans-serif" font-size="76" font-style="italic" font-weight="800" letter-spacing="-5">Dude</text>
    <path d="M215 174h510" stroke="#BDEBFF" stroke-opacity=".7"/>
  </g>

  <text x="222" y="354" fill="#CDEEFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="6">PRODUCT STUDIO</text>
  <path d="M222 372h490" stroke="url(#cyan)" stroke-width="2" stroke-linecap="round"/>

  <text x="870" y="218" fill="#F4F8FC" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" letter-spacing="-.7">Your digital rhythm.</text>
  <text x="873" y="265" fill="#AEBCCD" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">Mobile + web apps for planning, productivity,</text>
  <text x="873" y="296" fill="#AEBCCD" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400">and ideas worth keeping close.</text>

  <g transform="translate(873 345)">
    <rect width="126" height="34" rx="17" fill="#101C2B" stroke="#00D4FF" stroke-opacity=".48"/>
    <text x="63" y="22" text-anchor="middle" fill="#B8F2FF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">PLAN</text>
    <rect x="138" width="126" height="34" rx="17" fill="#101C2B" stroke="#6B8CFF" stroke-opacity=".48"/>
    <text x="201" y="22" text-anchor="middle" fill="#D3DCFF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">FOCUS</text>
    <rect x="276" width="126" height="34" rx="17" fill="#101C2B" stroke="#00D4FF" stroke-opacity=".48"/>
    <text x="339" y="22" text-anchor="middle" fill="#B8F2FF" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CREATE</text>
  </g>

  <text x="873" y="423" fill="#718197" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="2.4">XDude.pro</text>
  <circle cx="858" cy="418" r="3" fill="#00D4FF"/>
</svg>
