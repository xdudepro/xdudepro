  <text x="62" y="140" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-2.2" fill="url(#chrome)">Small ideas.</text>
  <text x="62" y="198" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-2.2" fill="#F4F4F5">Serious execution.</text>
  <text y="252" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18" fill="#A1A1AA"><tspan x="64" dy="0">XDude is a product studio creating mobile and web</tspan><tspan x="64" dy="28">apps from first idea to release. Every product starts</tspan><tspan x="64" dy="28">with a clear purpose and stays focused on what matters.</tspan></text>
  <rect x="64" y="360" width="110" height="34" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity=".2"/><text x="82" y="382" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" fill="#E4E4E7">PLANNING</text><rect x="183.6" y="360" width="146" height="34" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity=".2"/><text x="201.6" y="382" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" fill="#E4E4E7">PRODUCTIVITY</text><rect x="340.0" y="360" width="211" height="34" rx="17" fill="none" stroke="#FFFFFF" stroke-opacity=".2"/><text x="358.0" y="382" font-family="'Geist','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" fill="#E4E4E7">IDEAS WORTH KEEPING</text>

