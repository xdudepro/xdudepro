  <text y="210" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15"><tspan x="740" fill="#52525B">03</tspan><tspan x="782" fill="#A1A1AA">focus</tspan><tspan fill="#52525B">: </tspan><tspan fill="#F4F4F5">["Mobile apps", "Web", "Digital products"]</tspan></text>
  <text y="240" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15"><tspan x="740" fill="#52525B">04</tspan><tspan x="782" fill="#A1A1AA">interests</tspan><tspan fill="#52525B">: </tspan><tspan fill="#F4F4F5">["Planning", "Productivity", "Ideas"]</tspan></text>
  <text y="270" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15"><tspan x="740" fill="#52525B">05</tspan><tspan x="782" fill="#A1A1AA">stack</tspan><tspan fill="#52525B">: </tspan><tspan fill="#F4F4F5">["Flutter", "Next.js", "Supabase"]</tspan></text>
  <text y="300" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15"><tspan x="740" fill="#52525B">06</tspan><tspan x="782" fill="#A1A1AA">approach</tspan><tspan fill="#52525B">: </tspan><tspan fill="#F4F4F5">"From idea to release"</tspan></text>
  <text y="330" font-family="'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="15"><tspan x="740" fill="#52525B">07</tspan><tspan x="782" fill="#A1A1AA">website</tspan><tspan fill="#52525B">: </tspan><tspan fill="#F4F4F5">"xdude.pro"</tspan></text>
