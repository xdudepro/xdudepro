<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="About XDude — Small ideas. Serious execution. A product studio creating mobile and web apps from first idea to release.">
  <title>About XDude — Small ideas. Serious execution.</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101010"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity=".08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".05"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".48" stop-color="#E4E4E7"/><stop offset="1" stop-color="#A1A1AA"/></linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r=".6" fill="#FFFFFF" fill-opacity=".07"/></pattern>
    <linearGradient id="metal" x1="0" x2="1"><stop offset="0" stop-color="#101012"/><stop offset=".24" stop-color="#77777c"/><stop offset=".34" stop-color="#eeeeef"/><stop offset=".4" stop-color="#55555a"/><stop offset=".48" stop-color="#c5c5c9"/><stop offset=".57" stop-color="#303034"/><stop offset=".76" stop-color="#8b8b91"/><stop offset="1" stop-color="#080808"/></linearGradient>
    <radialGradient id="sheen" cx=".2" cy="0" r=".9"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C0C0E"/><stop offset="1" stop-color="#070708"/></linearGradient>
  </defs>
  <style>
    .cur { animation: blink 1.1s steps(1) infinite } @keyframes blink { 50% { opacity:0 } }
    .scan { animation: scan 7s ease-in-out infinite } @keyframes scan { 0% { transform: translateY(0); opacity:0 } 10% { opacity:1 } 80% { opacity:1 } 100% { transform: translateY(250px); opacity:0 } }
    @media (prefers-reduced-motion: reduce) { .cur,.scan { animation:none } .scan { opacity:0 } }
  </style>
  <rect x="1" y="1" width="1278" height="438" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="438" rx="20" fill="url(#dots)"/>
  <rect x="1" y="1" width="1278" height="438" rx="20" fill="url(#sheen)"/>
  <rect x="1" y="1" width="1278" height="438" rx="20" fill="none" stroke="url(#edge)" stroke-width="1.2"/>

